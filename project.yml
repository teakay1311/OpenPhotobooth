name: OpenPhotobooth
options:
  bundleIdPrefix: vn.openphotobooth
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_LDFLAGS: "$(inherited) -lsqlite3"

targets:
  OpenPhotobooth:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.openphotobooth.app
        PRODUCT_NAME: Open Photobooth
        PRODUCT_MODULE_NAME: OpenPhotobooth
        ENABLE_TESTABILITY: "YES"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/OpenPhotobooth.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: "YES"
        DEAD_CODE_STRIPPING: "YES"
    dependencies: []

  OpenPhotoboothTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: OpenPhotobooth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.openphotobooth.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Open Photobooth.app/Contents/MacOS/Open Photobooth"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"

schemes:
  OpenPhotobooth:
    build:
      targets:
        OpenPhotobooth: all
        OpenPhotoboothTests: [test]
    test:
      targets:
        - OpenPhotoboothTests
